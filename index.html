<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP1 – Reading & Speaking Skills</title>
<style>
:root{
  --dav-blue:#0b4f88;
  --dav-blue-deep:#083f72;
  --dav-red:#ef3340;
  --ink:#18344f;
  --muted:#6d7c88;
  --paper:#f4f3ef;
  --paper-2:#faf9f6;
  --line:rgba(11,79,136,.18);
  --max:1180px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input{font:inherit}

.page{
  width:min(var(--max),calc(100% - 56px));
  margin:0 auto;
}

/* Header */
.topbar{
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:28px;
  padding:18px 0 8px;
}
.search-wrap{
  position:relative;
  width:min(280px,38vw);
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--dav-blue-deep);
}
.search-icon{
  width:18px;height:18px;flex:0 0 18px;
  border:1.8px solid currentColor;border-radius:50%;position:relative;
}
.search-icon::after{
  content:"";position:absolute;width:7px;height:1.8px;background:currentColor;
  right:-5px;bottom:-2px;transform:rotate(45deg);transform-origin:left center;border-radius:2px;
}
.search-input{
  width:100%;
  border:0;
  border-bottom:1px solid rgba(8,63,114,.34);
  background:transparent;
  color:var(--ink);
  outline:none;
  padding:8px 2px 8px 3px;
  font-size:14px;
}
.search-input::placeholder{color:#8d9aa5}
.search-input:focus{border-bottom-color:var(--dav-blue)}
.search-clear{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  border:0;background:transparent;color:var(--dav-red);font-size:20px;line-height:1;
  padding:4px;cursor:pointer;display:none;
}
.search-wrap.has-query .search-clear{display:block}
.search-wrap.has-query .search-input{padding-right:26px}

.brand-logos{display:flex;align-items:center;gap:12px}
.brand-logos::before{
  content:"";height:46px;width:1px;background:var(--line);order:2;margin:0 2px;
}
.brand-logos img{display:block;object-fit:contain;background:transparent}
.brand-logos .dav{width:62px;height:62px;order:1}
.brand-logos .ef{width:62px;height:62px;order:3;border-radius:50%}

/* Hero */
.hero{
  text-align:center;
  padding:24px 16px 58px;
}
.hero h1{
  margin:0;
  color:var(--dav-blue-deep);
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:clamp(38px,4.8vw,64px);
  line-height:1.16;
  letter-spacing:-.025em;
}
.hero h2{
  margin:12px 0 0;
  color:var(--dav-blue-deep);
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:clamp(24px,2.6vw,35px);
  line-height:1.35;
}
.hero-rule{width:44px;height:2px;background:var(--dav-red);margin:18px auto 16px}
.hero p{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-style:italic;
  color:#425974;
  font-size:18px;
  line-height:1.6;
}

/* Gallery */
.gallery{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:0;
  padding:0 0 28px;
}
.gallery-row{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  column-gap:88px;
  min-height:250px;
  align-items:start;
}
.gallery-row.single{
  grid-template-columns:1fr;
  min-height:250px;
}

.unit{
  width:100%;
  max-width:520px;
  display:grid;
  grid-template-columns:minmax(145px,.78fr) minmax(180px,1.22fr);
  gap:26px;
  align-items:center;
  position:relative;
  transition:opacity .2s ease, transform .2s ease;
}
.unit.right{justify-self:end}
.unit.left{justify-self:start}
.unit.center{justify-self:center;max-width:620px}

/* intentional vertical offsets: gallery rhythm */
.u1{transform:translateY(36px)}
.u2{transform:translateY(0)}
.u3{transform:translateY(22px)}
.u4{transform:translateY(0)}
.u5{transform:translateY(46px)}
.u6{transform:translateY(18px)}
.u7{transform:translateY(0)}
.u8{transform:translateY(0)}
.u9{transform:translateY(52px)}
.u10{transform:translateY(18px)}
.u11{transform:translateY(30px)}
.u12{transform:translateY(0)}

.unit.media-right{grid-template-areas:"copy media";grid-template-columns:minmax(180px,1fr) minmax(160px,.95fr)}
.unit.media-left{grid-template-areas:"media copy";grid-template-columns:minmax(160px,.95fr) minmax(180px,1fr)}
.unit-copy{grid-area:copy;min-width:0}
.unit-media{grid-area:media;display:block;border-radius:13px;overflow:hidden;background:#e6e7e5}
.unit-media img{display:block;width:100%;aspect-ratio:1.34/1;object-fit:cover;object-position:center}
.unit-number{
  color:var(--dav-red);
  font-size:14px;
  font-weight:700;
  letter-spacing:.02em;
  margin:0 0 4px;
}
.unit-title{
  display:inline-block;
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(23px,2vw,29px);
  line-height:1.1;
  font-weight:500;
  color:var(--dav-blue-deep);
}
.explore{
  display:inline-flex;
  align-items:center;
  gap:9px;
  margin-top:14px;
  color:#365d84;
  font-size:14px;
  line-height:1.25;
}
.explore .arrow{color:var(--dav-red);font-size:23px;line-height:1;transform:translateY(-1px)}
.media-right .explore .arrow{order:2}
.media-left .explore .arrow{order:0}
.media-left .explore .label{order:1}
.unit-title:hover,.explore:hover{color:var(--dav-red)}
.unit-media:hover img{transform:scale(1.018)}
.unit-media img{transition:transform .25s ease}

.unit.unavailable{opacity:.47}
.unit.unavailable .unit-title,
.unit.unavailable .unit-media,
.unit.unavailable .explore{cursor:not-allowed}
.unit.unavailable .explore .label::after{content:" — Unavailable";font-size:12px;color:var(--muted)}

/* Campus visual break */
.campus-break{
  margin:34px 0 62px;
  min-height:235px;
  position:relative;
  overflow:hidden;
  border-radius:14px;
  background:#dfe7eb;
}
.campus-break img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 47%}
.campus-break::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(244,243,239,.96) 0%,rgba(244,243,239,.78) 27%,rgba(244,243,239,.20) 53%,rgba(244,243,239,0) 72%);
}
.campus-copy{
  position:relative;z-index:2;
  width:min(430px,48%);
  padding:55px 0 42px 34px;
}
.campus-copy h3{
  margin:0;
  color:var(--dav-blue-deep);
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(26px,3vw,39px);
  line-height:1.12;
  font-weight:500;
}
.campus-copy .red-rule{width:38px;height:2px;background:var(--dav-red);margin:17px 0}
.campus-copy p{margin:0;color:var(--dav-blue-deep);font-family:Georgia,"Times New Roman",serif;font-size:17px}

/* Search mode */
.search-status{text-align:center;color:var(--muted);font-size:14px;min-height:20px;margin:-22px 0 28px}
body.searching .gallery{min-height:420px}
body.searching .gallery-row{display:contents}
body.searching .unit{display:none;transform:none!important;margin:0 auto}
body.searching .unit.search-match{
  display:grid;
  justify-self:center;
  align-self:start;
  width:min(680px,100%);
  max-width:680px;
  margin:58px auto 110px;
  grid-template-columns:minmax(190px,.9fr) minmax(230px,1.1fr);
}
body.searching .campus-break{display:none}
body.searching .gallery-row.single{min-height:0}
body.searching .gallery-row{min-height:0}
body.searching .unit.search-match .unit-media img{aspect-ratio:1.34/1}
body.searching .unit.search-match .unit-title{font-size:32px}
.no-results{
  display:none;
  text-align:center;
  padding:90px 20px 130px;
  color:var(--muted);
  font-family:Georgia,"Times New Roman",serif;
  font-size:22px;
}
body.searching.no-match .no-results{display:block}

/* Footer */
.footer{
  border-top:1px solid rgba(8,63,114,.26);
  min-height:82px;
  display:flex;
  align-items:flex-start;
  padding:18px 0 30px;
  color:#36516c;
  font-size:13px;
}

@media(max-width:960px){
  .page{width:min(var(--max),calc(100% - 36px))}
  .gallery-row{column-gap:40px;min-height:235px}
  .unit{gap:18px;grid-template-columns:1fr 1.15fr}
  .unit.media-right,.unit.media-left{grid-template-columns:1fr 1fr}
  .unit-title{font-size:23px}
}

@media(max-width:760px){
  .page{width:min(var(--max),calc(100% - 26px))}
  .topbar{padding-top:12px}
  .brand-logos .dav,.brand-logos .ef{width:48px;height:48px}
  .brand-logos::before{height:36px}
  .hero{padding:20px 8px 42px}
  .gallery-row,.gallery-row.single{display:block;min-height:0}
  .unit,.unit.left,.unit.right,.unit.center{
    max-width:590px;
    margin:0 auto 58px;
    transform:none!important;
  }
  .campus-break{margin:6px 0 54px;min-height:225px}
  .campus-copy{width:70%;padding-left:24px}
  body.searching .unit.search-match{margin:38px auto 80px}
}

@media(max-width:560px){
  .topbar{align-items:flex-start}
  .search-wrap{width:48vw}
  .brand-logos{gap:7px}
  .brand-logos .dav,.brand-logos .ef{width:42px;height:42px}
  .hero h1{font-size:35px}
  .hero h2{font-size:25px}
  .unit,.unit.media-right,.unit.media-left,
  body.searching .unit.search-match{
    grid-template-columns:1fr;
    grid-template-areas:"media" "copy";
    gap:15px;
  }
  .unit-media img{aspect-ratio:16/10}
  .media-left .explore .arrow,.media-right .explore .arrow{order:2}
  .media-left .explore .label,.media-right .explore .label{order:1}
  .campus-break::after{background:linear-gradient(90deg,rgba(244,243,239,.94),rgba(244,243,239,.48) 72%,rgba(244,243,239,.1))}
  .campus-copy{width:88%;padding-top:42px}
}

@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <label class="search-wrap" id="searchWrap">
      <span class="search-icon" aria-hidden="true"></span>
      <input id="unitSearch" class="search-input" type="search" autocomplete="off" placeholder="Search units..." aria-label="Search units">
      <button id="searchClear" class="search-clear" type="button" aria-label="Clear search">×</button>
    </label>
    <div class="brand-logos" aria-label="Diplomatic Academy of Vietnam and English Faculty">
      <img class="dav" src="assets/dav-logo.png" alt="Diplomatic Academy of Vietnam logo">
      <img class="ef" src="assets/english-faculty-logo.jpg" alt="English Faculty logo">
    </div>
  </header>

  <section class="hero">
    <h1>English for Specific Purposes I</h1>
    <h2>Reading &amp; Speaking Skills</h2>
    <div class="hero-rule"></div>
    <p>Read the world. Share your ideas.</p>
  </section>

  <div id="searchStatus" class="search-status" aria-live="polite"></div>

  <main id="gallery" class="gallery">
    <div class="gallery-row">
      <article class="unit media-left right u1" data-id="1" data-title="Influencer Marketing"></article>
      <article class="unit media-right left u2" data-id="2" data-title="Climate Change"></article>
    </div>

    <div class="gallery-row single">
      <article class="unit media-left center u3" data-id="3" data-title="Social Media & National Security"></article>
    </div>

    <div class="gallery-row">
      <article class="unit media-right left u4" data-id="4" data-title="Higher Education"></article>
      <article class="unit media-left right u5" data-id="5" data-title="Environmentalism"></article>
    </div>

    <section class="campus-break" aria-label="Diplomatic Academy of Vietnam">
      <img src="assets/dav-campus.png" alt="Diplomatic Academy of Vietnam campus">
      <div class="campus-copy">
        <h3>People, Ideas, Change the World</h3>
        <div class="red-rule"></div>
        <p>Diplomatic Academy of Vietnam</p>
      </div>
    </section>

    <div class="gallery-row">
      <article class="unit media-right left u6" data-id="6" data-title="Pursuit of Music Career"></article>
      <article class="unit media-left right u7" data-id="7" data-title="Exploring the World"></article>
    </div>

    <div class="gallery-row">
      <article class="unit media-right left u8" data-id="8" data-title="E-Commerce"></article>
      <article class="unit media-left right u9" data-id="9" data-title="Future of Foods"></article>
    </div>

    <div class="gallery-row single">
      <article class="unit media-left center u10" data-id="10" data-title="Freedom of Information"></article>
    </div>

    <div class="gallery-row">
      <article class="unit media-left left u11" data-id="11" data-title="Vaccination"></article>
      <article class="unit media-left right u12" data-id="12" data-title="International Cooperation"></article>
    </div>

    <div class="no-results" id="noResults">No matching unit found.</div>
  </main>

  <footer class="footer">Instructor — Ms Tra</footer>
</div>

<script>
const UNITS = [
  {id:1,title:'Influencer Marketing'},
  {id:2,title:'Climate Change'},
  {id:3,title:'Social Media & National Security'},
  {id:4,title:'Higher Education'},
  {id:5,title:'Environmentalism'},
  {id:6,title:'Pursuit of Music Career'},
  {id:7,title:'Exploring the World'},
  {id:8,title:'E-Commerce'},
  {id:9,title:'Future of Foods'},
  {id:10,title:'Freedom of Information'},
  {id:11,title:'Vaccination'},
  {id:12,title:'International Cooperation'}
];

const unitEls = [...document.querySelectorAll('.unit')];

function arrowFor(el){
  return el.classList.contains('media-left') ? '←' : '→';
}

function populateUnit(el){
  const id = Number(el.dataset.id);
  const unit = UNITS.find(u => u.id === id);
  const arrow = arrowFor(el);
  el.innerHTML = `
    <a class="unit-media unit-link" href="unit${id}/" aria-label="Open Unit ${id}: ${unit.title}">
      <img src="assets/unit${id}.png" alt="${unit.title} thumbnail">
    </a>
    <div class="unit-copy">
      <div class="unit-number">${String(id).padStart(2,'0')}</div>
      <a class="unit-title unit-link" href="unit${id}/">${unit.title}</a>
      <div><a class="explore unit-link" href="unit${id}/"><span class="arrow">${arrow}</span><span class="label">Explore Unit</span></a></div>
    </div>`;
}
unitEls.forEach(populateUnit);

async function unitExists(id){
  try{
    const r = await fetch(`unit${id}/index.html`, {method:'GET', cache:'no-store'});
    return r.ok;
  }catch(e){return false}
}

async function initialiseUnits(){
  for(const el of unitEls){
    const id = Number(el.dataset.id);
    const ok = await unitExists(id);
    if(!ok){
      el.classList.add('unavailable');
      el.setAttribute('aria-disabled','true');
      el.querySelectorAll('.unit-link').forEach(link => {
        link.removeAttribute('href');
        link.setAttribute('tabindex','-1');
        link.addEventListener('click', e => e.preventDefault());
      });
    }
  }
}
initialiseUnits();

const input = document.getElementById('unitSearch');
const clearBtn = document.getElementById('searchClear');
const searchWrap = document.getElementById('searchWrap');
const status = document.getElementById('searchStatus');

function normalize(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}

function applySearch(){
  const raw = input.value.trim();
  const q = normalize(raw);
  const searching = q.length > 0;
  document.body.classList.toggle('searching', searching);
  searchWrap.classList.toggle('has-query', searching);

  unitEls.forEach(el => el.classList.remove('search-match'));
  document.body.classList.remove('no-match');

  if(!searching){
    status.textContent = '';
    return;
  }

  const matches = unitEls.filter(el => {
    const id = el.dataset.id;
    const title = normalize(el.dataset.title);
    const haystack = `${id} unit ${id} ${title}`;
    return haystack.includes(q);
  });

  matches.forEach(el => el.classList.add('search-match'));

  if(matches.length === 0){
    document.body.classList.add('no-match');
    status.textContent = `No results for “${raw}”.`;
  }else if(matches.length === 1){
    status.textContent = `Showing Unit ${matches[0].dataset.id}.`;
  }else{
    status.textContent = `Showing ${matches.length} matching units.`;
  }
}

input.addEventListener('input', applySearch);
clearBtn.addEventListener('click', () => {
  input.value='';
  applySearch();
  input.focus();
});
</script>
</body>
</html>
